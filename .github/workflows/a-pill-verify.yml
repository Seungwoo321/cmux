name: a-pill-verify (scratch, never lands)
on:
  push:
    branches: ['scratch/a-pill-verify-*']
jobs:
  messageslab-tests:
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            Packages/Shared
            .xcode-version
      - name: Swift version
        run: swift --version
      - name: MessagesLabHome tests (alignment, progress, neighbours)
        run: |
          swift test --package-path Packages/Shared/CmuxMessagesLab \
            --filter 'HomeGroupColumnAlignmentTests|HomeTurnProgressTests|HomeGroupSenderTests|HomeRunTailTests|HomeAgentPillRowTests|HomeNoticeShimmerTests|HomeTypingGapTests|HomeGroupReplyQuoteTests|HomeAgentMessageFoldTests' 2>&1 | tail -150
          exit ${PIPESTATUS[0]}
      - name: Capture the scene, light and dark (scratch)
        if: always()
        run: |
          CAPTURE_DIR=$PWD/shots swift test --package-path Packages/Shared/CmuxMessagesLab --filter ScratchAlignmentCapture 2>&1 | tail -30
          ls -la shots || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shots-${{ github.ref_name == 'scratch/a-pill-verify-red' && 'before' || 'after' }}
          path: shots/*.png
