name: scratch a-dialogs compile

# Scratch (side branch a-dialogs-compile-4 only, never on feat-cmux-next): the fleet controller is down,
# so build the CmuxNext package with its tests on Blacksmith and run the dialog slice's suites.
on:
  push:
    branches: [a-dialogs-compile-4]

permissions:
  contents: read

jobs:
  compile:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Build CmuxNext with its tests and run the dialog suites
        env:
          CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
        run: >-
          ./scripts/ci/package-test-lane.sh suite Packages/macOS/CmuxNext
          OverlayGlassVariantTests,OverlayDialogCardTests,CmuxToastPageGlassTests,FloatingGlassStyleTests,ToastVeilThemeTintTests,BrowserCookieImportCardLookTests,OverlayDialogIconTests,BrowserCookieBannerTests,HomeHiddenConversationsTests,WindowRulesCloseTests,DialogKeyHintTests
